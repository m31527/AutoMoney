# Optional local-model experiment. Use together with compose.yaml on the target machine.
services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # API is reachable only within the Compose network; no host port is published.

  ai-trader:
    build: .
    init: true
    command: ["ollama-start"]
    environment:
      TRADING_MODE: PAPER
      ENABLE_LIVE_TRADING: "false"
      DATABASE_URL: sqlite:////data/paper.db
      AI_PROVIDER: ollama
      AI_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      PAPER_CYCLES: ${PAPER_CYCLES:-0}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - paper-data:/data
      - ./config/default.toml:/app/config/default.toml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 150s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama-models:
