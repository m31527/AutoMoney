# Research only: no effect on the normal Ollama PAPER account or risk limits.
services:
  ai-trader:
    # DGX/Linux: reach native OpenTeddy without exposing its other APIs to the LAN.
    network_mode: host
    env_file:
      - config/openteddy.env
    environment:
      AI_SHADOW_PROVIDER: openteddy
      # One unanchored v4 observation every 30 minutes: same maximum calls per day.
      AI_SHADOW_PAIRED: "false"
      AI_SHADOW_INTERVAL_SECONDS: "1800"
