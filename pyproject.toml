[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-crypto-trader"
version = "0.2.0"
description = "Safety-first crypto spot trading experiment — multi-strategy PAPER comparison"
requires-python = ">=3.12"
dependencies = ["certifi>=2025.1.31"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
trader = "trader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.setuptools.package-data]
trader = ["web/*.html", "web/*.css", "web/*.js"]
